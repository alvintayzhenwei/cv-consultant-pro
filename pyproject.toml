[project]
# The distribution deliberately shares its name with the MCP console script
# below, so `uvx cv-consultant-pro-mcp` works with no `--from`. uvx resolves the
# name it is handed as a PACKAGE, so any mismatch between the two sends a user
# who omits the flag somewhere else entirely — which is exactly what happened
# under the old name. Same shape as the sibling a2a-raid-mcp package.
name = "cv-consultant-pro-mcp"
version = "0.1.1"
description = "Turn a job description into a tailored, ATS-safe application kit from a private career corpus — without inventing a single claim."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alvin Tay Zhenwei" }]
keywords = ["cv", "resume", "ats", "job-description", "career"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Dependency ceilings are deliberate, not decoration.
#
# The sibling projects learned this the hard way: `mcp` was declared `>=1.12`
# with no ceiling, mcp 2.0 renamed the module the server imported, and from then
# on every fresh `uvx <pkg>` resolved the new major and died at import — so the
# published install instructions could not work for anybody. The suite could not
# catch it either, because a locked dev venv already held the old major; only a
# fresh resolve picks up a new one.
#
# So: every dependency gets an upper bound, and `tests/test_packaging.py`
# asserts the bound is still tied to the API this package actually uses. Raise a
# floor deliberately when migrating; never widen a range to make an error go away.
dependencies = [
    "PyYAML>=6.0,<7",      # corpus format
    "python-docx>=1.1,<2", # ATS-safe .docx rendering
    "httpx>=0.27,<1",      # job-posting fetch
    "pypdf>=5.0,<7",       # reading a LinkedIn profile PDF
    # The ceiling here is the exact case the comment above describes rather than
    # a precaution: mcp 2.0 renamed `mcp.server.fastmcp.FastMCP`, which
    # mcp_server.py imports, to `mcp.server.mcpserver.MCPServer` and deleted the
    # old path. Two sibling packages shipped without this bound, and from the day
    # mcp 2.x landed every fresh `uvx` install died at import - so the published
    # instructions could not work for anybody. Move the FLOOR to >=2 when
    # migrating; never widen the range to make an error go away.
    "mcp>=1.12,<2",        # the plugin server
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.6,<1",
]

[project.scripts]
cv-consultant-pro = "cv_consultant_pro.cli:main"
# What the Claude Code and Codex plugin manifests launch, and what a generic MCP
# client puts in its `command`. A separate entry point from the CLI because one
# speaks to a person on a terminal and the other speaks JSON-RPC on stdout;
# sharing one would mean a stray print breaking the protocol.
#
# It matches the distribution name on purpose — see the note beside `name`.
#
# It must never be called `cv-tailor-mcp`, which is what it was first, before
# anything was published: that is an existing, unrelated PyPI project by another
# author which also tailors CVs. Naming our command after someone else's package
# sends anyone who mistypes the install to THEIR code, and takes their name in
# our own documentation. Guarded in tests/test_packaging.py.
cv-consultant-pro-mcp = "cv_consultant_pro.mcp_server:main"

[project.urls]
Repository = "https://github.com/alvintayzhenwei/cv-consultant-pro"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_consultant_pro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

# Everything below is stated rather than inferred, because inference is what
# made CI and a developer machine disagree.
#
# CI failed with I001 on eight test files that `ruff check .` passed locally —
# same ruff version, byte-identical files, same config. The difference was how
# ruff classified `cv_consultant_pro`: first-party locally, where only ./src exists, and
# third-party in CI, where `uv sync` had also installed the package into .venv.
# That flips which import group each line belongs to, and therefore whether a
# blank line between them is correct.
#
# A lint rule whose verdict depends on whether the project happens to be
# installed is not a lint rule; it is a coin toss that only lands wrong in CI.
[tool.ruff.lint]
# The default set is E4, E7, E9 and F — isort is NOT in it. CI applied it
# anyway, so the selection was ambiguous too. Say it.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
# The line that actually fixes the divergence.
known-first-party = ["cv_consultant_pro"]
